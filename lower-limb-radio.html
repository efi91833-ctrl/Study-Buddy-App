<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lower Limb Radiology - Label Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      padding: 10px 18px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 16px; color: #fff; font-weight: bold; }
    #header .subtitle { font-size: 13px; color: #888; }
    #score-display { margin-left: auto; font-size: 13px; color: #aaa; }
    #score-display span { color: #4caf50; font-weight: bold; }

    #content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: 160px;
      overflow-y: auto;
      background: #1a1a1a;
      border-right: 1px solid #333;
      padding: 8px 6px;
      flex-shrink: 0;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    .slide-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 3px;
      background: #222;
      border: 1px solid #333;
      color: #bbb;
      cursor: pointer;
      border-radius: 4px;
      text-align: left;
      font-size: 12px;
      transition: background 0.15s;
    }
    .slide-btn:hover { background: #2a2a2a; color: #fff; }
    .slide-btn.active { background: #c0392b; border-color: #e74c3c; color: #fff; }
    .slide-btn .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555; flex-shrink: 0;
    }
    .slide-btn.partial .dot { background: #f39c12; }
    .slide-btn.done .dot { background: #27ae60; }
    .slide-btn .lbl-count { margin-left: auto; font-size: 10px; color: #666; }
    .slide-btn.active .lbl-count { color: #ffaaaa; }

    /* MAIN */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px;
      gap: 10px;
    }

    #slide-area {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    /* The container that maintains the image aspect ratio */
    #slide-container {
      position: relative;
      /* aspect-ratio set dynamically, max constrained to area */
      max-height: 100%;
      max-width: 100%;
    }

    #slide-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      border-radius: 4px;
    }

    #overlay-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }

    .label-box {
      position: absolute;
      cursor: pointer;
      pointer-events: all;
      background: rgba(192, 57, 43, 0.82);
      border: 1.5px solid #e74c3c;
      border-radius: 3px;
      transition: background 0.15s, border-color 0.15s;
    }
    .label-box:hover {
      background: rgba(231, 76, 60, 0.6);
    }
    .label-box.selected {
      background: rgba(243, 156, 18, 0.92);
      border-color: #f39c12;
      box-shadow: 0 0 0 2px rgba(243,156,18,0.4);
    }
    .label-box.correct {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 5px #000, 0 0 5px #000, 0 0 3px #000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(7px, 1vw, 13px);
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: visible;
    }
    .label-box.shake {
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-5px); }
      40%  { transform: translateX(5px); }
      60%  { transform: translateX(-3px); }
      80%  { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    /* ANSWER PANEL */
    #answer-panel {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 56px;
    }
    #answer-prompt {
      font-size: 13px;
      color: #777;
      white-space: nowrap;
    }
    #answer-prompt.selected {
      color: #f39c12;
    }
    #answer-input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }
    #answer-input:focus { border-color: #e74c3c; }
    #answer-input:disabled { opacity: 0.4; }
    #check-btn {
      background: #c0392b;
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    #check-btn:hover { background: #e74c3c; }
    #check-btn:disabled { opacity: 0.4; cursor: default; }
    #feedback {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      min-width: 60px;
    }
    #feedback.ok { color: #27ae60; }
    #feedback.err { color: #e74c3c; }

    #hint-btn {
      background: #333;
      border: 1px solid #555;
      color: #aaa;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #hint-btn:hover { background: #3a3a3a; color: #eee; }
    #hint-btn:disabled { opacity: 0.3; cursor: default; }

    #slide-title {
      font-size: 11px;
      color: #555;
      text-align: center;
      padding: 2px 0;
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <div id="header-h1" style="font-size:16px; font-weight:bold; color:#fff;">Lower Limb Radiology</div>
    <div class="subtitle">Label Quiz — click a red box, type the answer</div>
  </div>
  <div id="score-display">Revealed: <span id="score">0</span> / <span id="total">0</span></div>
</div>

<div id="content">
  <div id="sidebar" role="navigation" aria-label="Slide list"></div>

  <div id="main">
    <div id="slide-area">
      <div id="slide-container" style="aspect-ratio: 1500/1125;">
        <img id="slide-img" alt="Radiology slide" />
        <div id="overlay-layer"></div>
      </div>
    </div>
    <div id="slide-title">Select a slide from the left panel</div>
    <div id="answer-panel">
      <span id="answer-prompt">Click a red label box to select it</span>
      <input id="answer-input" type="text" placeholder="Type the anatomical term..." disabled autocomplete="off" autocorrect="off" spellcheck="false" />
      <button id="hint-btn" disabled title="Show first letter hint">Hint</button>
      <button id="check-btn" disabled>Check</button>
      <span id="feedback"></span>
    </div>
  </div>
</div>

<script src="lower-limb-radio-data.js"></script>
<script>
// ── State ───────────────────────────────────────────────────────────────────
const IMG_W = 1500, IMG_H = 1125;

// progress[slideNum][labelIdx] = true if revealed
const progress = {};
let currentSlide = null;
let selectedIdx = null;
let hintCount = 0;

// ── Helpers ──────────────────────────────────────────────────────────────────
function normalize(s) {
  return s
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // remove diacritics
    .toLowerCase()
    .replace(/[^a-z0-9\s/]/g, '') // keep alphanumeric, space, slash
    .replace(/\s+/g, ' ')
    .trim();
}

function checkMatch(input, target) {
  const a = normalize(input);
  const b = normalize(target);
  if (a === b) return true;
  // allow if all significant words of target appear in input
  const targetWords = b.split(' ').filter(w => w.length > 2);
  if (targetWords.length === 0) return false;
  return targetWords.every(w => a.includes(w));
}

function pad(n) { return String(n).padStart(2, '0'); }

function imgPath(num) {
  return `LowerLimbRadio/slide-${pad(num)}.png`;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const nums = Object.keys(SLIDE_DATA).map(Number).sort((a,b)=>a-b).filter(n => n > 1);
  nums.forEach(num => {
    const labels = SLIDE_DATA[num];
    if (!progress[num]) progress[num] = {};
    const revealed = Object.keys(progress[num]).length;
    const total = labels.length;

    const btn = document.createElement('button');
    btn.className = 'slide-btn' + (revealed === total && total > 0 ? ' done' : revealed > 0 ? ' partial' : '');
    btn.dataset.slide = num;
    btn.innerHTML = `<span class="dot"></span> Slide ${num} <span class="lbl-count">${revealed}/${total}</span>`;
    btn.onclick = () => loadSlide(num);
    sidebar.appendChild(btn);
  });
}

function updateSidebarBtn(num) {
  const btn = document.querySelector(`.slide-btn[data-slide="${num}"]`);
  if (!btn) return;
  const labels = SLIDE_DATA[num];
  const revealed = Object.keys(progress[num] || {}).length;
  const total = labels.length;
  btn.className = 'slide-btn' + (num === currentSlide ? ' active' : '') +
    (revealed === total && total > 0 ? ' done' : revealed > 0 ? ' partial' : '');
  btn.querySelector('.lbl-count').textContent = `${revealed}/${total}`;
}

// ── Score ─────────────────────────────────────────────────────────────────────
function updateScore() {
  let revealed = 0, total = 0;
  Object.keys(SLIDE_DATA).forEach(num => {
    if (Number(num) === 1) return;
    total += SLIDE_DATA[num].length;
    revealed += Object.keys(progress[num] || {}).length;
  });
  document.getElementById('score').textContent = revealed;
  document.getElementById('total').textContent = total;
}

// ── Load Slide ────────────────────────────────────────────────────────────────
function loadSlide(num) {
  currentSlide = num;
  selectedIdx = null;
  hintCount = 0;

  // Update sidebar active state
  document.querySelectorAll('.slide-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.slide) === num);
  });

  const img = document.getElementById('slide-img');
  img.src = imgPath(num);
  document.getElementById('slide-title').textContent = `Slide ${num}`;

  buildOverlay(num);
  resetAnswerPanel();
}

function buildOverlay(num) {
  const layer = document.getElementById('overlay-layer');
  layer.innerHTML = '';
  const labels = SLIDE_DATA[num] || [];

  labels.forEach((lbl, idx) => {
    const box = document.createElement('div');
    box.className = 'label-box';
    box.dataset.idx = idx;

    // Position as percentage of image dims
    const leftPct  = Math.max(0, lbl.left / IMG_W * 100);
    const topPct   = Math.max(0, lbl.top  / IMG_H * 100);
    const widthPct = Math.min(lbl.width / IMG_W * 100, 100 - leftPct);
    const heightPct= Math.min(lbl.height / IMG_H * 100, 100 - topPct);

    box.style.left   = leftPct + '%';
    box.style.top    = topPct + '%';
    box.style.width  = widthPct + '%';
    box.style.height = heightPct + '%';

    if (progress[num] && progress[num][idx]) {
      box.classList.add('correct');
      box.textContent = lbl.text;
    } else {
      box.onclick = () => selectLabel(idx);
    }

    layer.appendChild(box);
  });
}

// ── Label Selection ───────────────────────────────────────────────────────────
function selectLabel(idx) {
  if (!currentSlide) return;
  if (progress[currentSlide] && progress[currentSlide][idx]) return;

  selectedIdx = idx;
  hintCount = 0;

  // Update box highlights
  document.querySelectorAll('.label-box').forEach(b => {
    b.classList.toggle('selected', Number(b.dataset.idx) === idx);
  });

  const lbl = SLIDE_DATA[currentSlide][idx];
  const prompt = document.getElementById('answer-prompt');
  prompt.textContent = 'What is labeled here?';
  prompt.className = 'selected';

  const input = document.getElementById('answer-input');
  input.disabled = false;
  input.value = '';
  input.focus();
  input.placeholder = 'Type the anatomical term...';

  document.getElementById('check-btn').disabled = false;
  document.getElementById('hint-btn').disabled = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
}

// ── Answer Checking ───────────────────────────────────────────────────────────
function checkAnswer() {
  if (selectedIdx === null || !currentSlide) return;
  const input = document.getElementById('answer-input');
  const answer = input.value.trim();
  if (!answer) return;

  const lbl = SLIDE_DATA[currentSlide][selectedIdx];
  const fb = document.getElementById('feedback');

  if (checkMatch(answer, lbl.text)) {
    // Correct!
    if (!progress[currentSlide]) progress[currentSlide] = {};
    progress[currentSlide][selectedIdx] = true;

    // Update the box
    const box = document.querySelector(`.label-box[data-idx="${selectedIdx}"]`);
    if (box) {
      box.classList.remove('selected');
      box.classList.add('correct');
      box.textContent = lbl.text;
      box.onclick = null;
    }

    fb.textContent = 'Correct!';
    fb.className = 'ok';

    selectedIdx = null;
    hintCount = 0;
    resetAnswerPanel(true);
    updateSidebarBtn(currentSlide);
    updateScore();
  } else {
    // Wrong
    fb.textContent = 'Try again';
    fb.className = 'err';
    input.value = '';

    const box = document.querySelector(`.label-box[data-idx="${selectedIdx}"]`);
    if (box) {
      box.classList.add('shake');
      box.addEventListener('animationend', () => box.classList.remove('shake'), { once: true });
    }
  }
}

function showHint() {
  if (selectedIdx === null || !currentSlide) return;
  const lbl = SLIDE_DATA[currentSlide][selectedIdx];
  hintCount++;
  const hint = lbl.text.slice(0, hintCount * 2);
  const input = document.getElementById('answer-input');
  input.value = hint;
  input.focus();
  const fb = document.getElementById('feedback');
  fb.textContent = '';
  fb.className = '';
}

function resetAnswerPanel(keepFeedback) {
  const input = document.getElementById('answer-input');
  input.disabled = true;
  input.value = '';
  document.getElementById('check-btn').disabled = true;
  document.getElementById('hint-btn').disabled = true;

  const prompt = document.getElementById('answer-prompt');
  prompt.textContent = currentSlide
    ? 'Click a red label box to select it'
    : 'Select a slide from the left panel';
  prompt.className = '';

  document.querySelectorAll('.label-box').forEach(b => b.classList.remove('selected'));

  if (!keepFeedback) {
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = '';
  }
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('check-btn').addEventListener('click', checkAnswer);

document.getElementById('hint-btn').addEventListener('click', showHint);

document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAnswer();
  if (e.key === 'Escape') {
    selectedIdx = null;
    hintCount = 0;
    resetAnswerPanel();
    document.querySelectorAll('.label-box').forEach(b => b.classList.remove('selected'));
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  // init progress store for all slides
  Object.keys(SLIDE_DATA).forEach(num => {
    if (Number(num) > 1) progress[num] = {};
  });
  buildSidebar();
  updateScore();

  // Auto-load first slide
  const firstSlide = Object.keys(SLIDE_DATA).map(Number).filter(n => n > 1).sort((a,b)=>a-b)[0];
  if (firstSlide) loadSlide(firstSlide);
}

init();
</script>
</body>
</html>

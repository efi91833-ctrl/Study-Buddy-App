<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Vessels Radiology</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      padding: 10px 18px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 16px; font-weight: bold; color: #fff; }
    #header .sub { font-size: 12px; color: #666; }
    #score-display { margin-left: auto; font-size: 13px; color: #aaa; }
    #score-display span { color: #4caf50; font-weight: bold; }
    #back-btn {
      background: #222; border: 1px solid #444; color: #aaa;
      padding: 6px 14px; border-radius: 4px; cursor: pointer;
      font-size: 12px; text-decoration: none; display: inline-block;
    }
    #back-btn:hover { color: #fff; background: #2a2a2a; }
    #reveal-btn {
      background: #333; border: 1px solid #555; color: #ccc;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    #reveal-btn:hover { background: #444; color: #fff; }
    #content { display: flex; flex: 1; overflow: hidden; }
    #sidebar {
      width: 150px; overflow-y: auto; background: #1a1a1a;
      border-right: 1px solid #333; padding: 8px 6px; flex-shrink: 0;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
    .slide-btn {
      display: flex; align-items: center; gap: 6px;
      width: 100%; padding: 7px 10px; margin-bottom: 3px;
      background: #222; border: 1px solid #333; color: #bbb;
      cursor: pointer; border-radius: 4px; text-align: left;
      font-size: 12px; transition: background 0.15s;
    }
    .slide-btn:hover { background: #2a2a2a; color: #fff; }
    .slide-btn.active { background: #2a2a2a; border-color: #c0392b; color: #fff; }
    .slide-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .slide-btn.partial .dot { background: #f39c12; }
    .slide-btn.done .dot { background: #27ae60; }
    .slide-btn .lbl-count { margin-left: auto; font-size: 10px; color: #666; }
    #main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; padding: 10px; gap: 8px;
    }
    #slide-area {
      flex: 1; min-height: 0; display: flex;
      align-items: center; justify-content: center;
      background: #000; border-radius: 6px; overflow: hidden;
    }
    #slide-container {
      position: relative; max-height: 100%; max-width: 100%;
    }
    #slide-img {
      display: block; width: 100%; height: 100%;
      object-fit: fill; border-radius: 4px;
    }
    #overlay-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .label-box {
      position: absolute;
      cursor: pointer;
      pointer-events: all;
      background: #777;
      border: 1.5px solid #555;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .label-box:hover { background: #999; }
    .label-box.revealed {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 5px #000, 0 0 5px #000, 0 0 3px #000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(7px, 1vw, 13px);
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: visible;
    }
    #status-bar {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 8px 14px; font-size: 12px; color: #555; flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>Blood Vessels Radiology</h1>
    <div class="sub">Click a grey box to reveal the label</div>
  </div>
  <button id="reveal-btn">Reveal All</button>
  <a href="../index.html" id="back-btn">Back</a>
  <div id="score-display">Revealed: <span id="score">0</span> / <span id="total">0</span></div>
</div>

<div id="content">
  <div id="sidebar" role="navigation"></div>
  <div id="main">
    <div id="slide-area">
      <div id="slide-container" style="aspect-ratio: 2001/1125;">
        <img id="slide-img" alt="Slide" />
        <div id="overlay-layer"></div>
      </div>
    </div>
    <div id="status-bar">Select a slide from the left panel</div>
  </div>
</div>

<script src="blood-vessels-data.js"></script>
<script>
const DATA = BLOOD_SLIDE_DATA;
const IMG_W = 2001, IMG_H = 1125;
const revealed = {};
let currentSlide = null;

function pad(n) { return String(n).padStart(2, '0'); }
function imgPath(n) { return `BloodVessels/slide-${pad(n)}.png`; }

function updateScore() {
  let rev = 0, tot = 0;
  Object.keys(DATA).forEach(n => {
    if (Number(n) <= 1) return;
    tot += DATA[n].length;
    rev += Object.keys(revealed[n] || {}).length;
  });
  document.getElementById('score').textContent = rev;
  document.getElementById('total').textContent = tot;
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  Object.keys(DATA).map(Number).filter(n => n > 1).sort((a,b) => a-b).forEach(num => {
    if (!revealed[num]) revealed[num] = {};
    const total = DATA[num].length;
    const rev = Object.keys(revealed[num]).length;
    const btn = document.createElement('button');
    btn.className = 'slide-btn' + (rev === total && total > 0 ? ' done' : rev > 0 ? ' partial' : '');
    btn.dataset.slide = num;
    btn.innerHTML = `<span class="dot"></span> Slide ${num} <span class="lbl-count">${rev}/${total}</span>`;
    btn.onclick = () => loadSlide(num);
    sb.appendChild(btn);
  });
}

function updateSidebarBtn(num) {
  const btn = document.querySelector(`.slide-btn[data-slide="${num}"]`);
  if (!btn) return;
  const rev = Object.keys(revealed[num] || {}).length;
  const total = DATA[num].length;
  btn.className = 'slide-btn' + (num === currentSlide ? ' active' : '') +
    (rev === total && total > 0 ? ' done' : rev > 0 ? ' partial' : '');
  btn.querySelector('.lbl-count').textContent = `${rev}/${total}`;
}

function loadSlide(num) {
  currentSlide = num;
  document.querySelectorAll('.slide-btn').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.slide) === num));
  document.getElementById('slide-img').src = imgPath(num);
  document.getElementById('status-bar').textContent = `Slide ${num} — click grey boxes to reveal labels`;
  buildOverlay(num);
}

function buildOverlay(num) {
  const layer = document.getElementById('overlay-layer');
  layer.innerHTML = '';
  (DATA[num] || []).forEach((lbl, idx) => {
    const box = document.createElement('div');
    box.className = 'label-box';
    box.dataset.idx = idx;
    const lp = Math.max(0, lbl.left / IMG_W * 100);
    const tp = Math.max(0, lbl.top  / IMG_H * 100);
    box.style.left   = lp + '%';
    box.style.top    = tp + '%';
    box.style.width  = Math.min(lbl.width  / IMG_W * 100, 100 - lp) + '%';
    box.style.height = Math.min(lbl.height / IMG_H * 100, 100 - tp) + '%';
    if (revealed[num] && revealed[num][idx]) {
      box.classList.add('revealed');
      box.textContent = lbl.text;
    } else {
      box.onclick = () => {
        if (!revealed[num]) revealed[num] = {};
        revealed[num][idx] = true;
        box.classList.add('revealed');
        box.textContent = lbl.text;
        box.onclick = null;
        updateSidebarBtn(num);
        updateScore();
      };
    }
    layer.appendChild(box);
  });
}

function revealAll() {
  if (!currentSlide) return;
  if (!revealed[currentSlide]) revealed[currentSlide] = {};
  (DATA[currentSlide] || []).forEach((lbl, idx) => {
    if (revealed[currentSlide][idx]) return;
    revealed[currentSlide][idx] = true;
    const box = document.querySelector(`.label-box[data-idx="${idx}"]`);
    if (box) { box.classList.add('revealed'); box.textContent = lbl.text; box.onclick = null; }
  });
  updateSidebarBtn(currentSlide);
  updateScore();
}

document.getElementById('reveal-btn').addEventListener('click', revealAll);

function init() {
  Object.keys(DATA).forEach(n => { if (Number(n) > 1) revealed[n] = {}; });
  buildSidebar();
  updateScore();
  const first = Object.keys(DATA).map(Number).filter(n => n > 1).sort((a,b) => a-b)[0];
  if (first) loadSlide(first);
}

init();
</script>
</body>
</html>
